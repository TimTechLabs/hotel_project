{% extends 'bookings/base.html' %}
{% block content %}
<div class="container py-5">
    <h2 class="fw-bold mb-4" style="font-family: 'Playfair Display', serif;">Restaurant Menu</h2>
    <div class="row">
        {% for item in menu_items %}
            <div class="col-md-4 mb-4">
                <div class="card h-100 shadow-sm border-0 rounded-4">
                    {% if item.image %}
                        <img src="{{ item.image.url }}" class="card-img-top" style="height: 200px; object-fit: cover;" alt="{{ item.name }}">
                    {% endif %}
                    <div class="card-body d-flex flex-column">
                        <h5 class="fw-bold">{{ item.name }}</h5>
                        <p class="text-muted small flex-grow-1">{{ item.description }}</p>
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <span class="fw-bold text-success">KSH {{ item.price }}</span>
                        </div>
                        <form method="POST" action="{% url 'bookings:food_add_to_cart' item.id %}" class="mt-3">
                            {% csrf_token %}
                            <div class="input-group">
                                <input type="number" name="quantity" value="1" min="1" class="form-control">
                                <button type="submit" class="btn btn-dark">Add to Cart</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
